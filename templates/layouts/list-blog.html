<section class="section-y border-b border-line">
  <div class="wrap">
    <span class="mb-2 block font-display text-sm font-semibold text-brand">{{# if page.kicker }}{{ page.kicker }}{{ else }}Knowledge hub{{/ if }}</span>
    <h1 class="text-hero">{{# if page.heroHeading }}{{ page.heroHeading }}{{ else }}{{ page.title }}{{/ if }}</h1>
    {{# if page.heroText }}<p class="mt-5 max-w-[54ch] text-lede text-ink-2">{{ page.heroText }}</p>{{/ if }}
    <p class="mt-3.5 text-muted"><a href="/rss.xml" class="text-brand hover:text-brand-dark">Subscribe by RSS</a></p>
  </div>
</section>

<section class="section-y">
  <div class="wrap card-grid">
    {{# each blog }}{{> card-post }}{{/ each }}
  </div>
</section>

{{> cta }}
