<section id="faq" class="section-y bg-mist">
  <div class="wrap">
    <div class="mb-12 max-w-[60ch]">
      <h2 class="text-h2">Questions we get asked first</h2>
      <p class="mt-3.5 text-lede text-muted">If yours is not here, ask it directly and we will answer it properly.</p>
    </div>
    <div class="faq border-t border-line">
      {{# each faqItems }}
      <details class="border-b border-line"{{# if @first }} open{{/ if }}>
        <summary>{{ question }}</summary>
        <p class="mb-5 max-w-[68ch]">{{ answer }}</p>
      </details>
      {{/ each }}
    </div>
  </div>
</section>
