<section class="section-y{{# if band }} bg-mist{{/ if }}">
  <div class="wrap">
    <div class="mb-12 max-w-[60ch]">
      {{# if kicker }}<span class="mb-2 block font-display text-sm font-semibold text-brand">{{ kicker }}</span>{{/ if }}
      <h2 class="text-h2">{{ heading }}</h2>
      {{# if text }}<p class="mt-3.5 text-lede text-muted">{{ text }}</p>{{/ if }}
    </div>
    <div class="card-grid">
      {{# each products }}{{> card-product }}{{/ each }}
    </div>
  </div>
</section>
