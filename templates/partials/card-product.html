<a class="card" href="{{ url }}">
  {{# if logo }}<img class="size-11 rounded object-contain" src="{{ logo }}" alt="" width="44" height="44">{{/ if }}
  <div class="flex flex-wrap items-center gap-2">
    {{# if badge }}<span class="badge badge-live badge-dot">{{ badge }}</span>{{/ if }}
    {{# if price }}<span class="badge">{{ price }}</span>{{/ if }}
  </div>
  <h3 class="text-h3">{{ title }}</h3>
  <p class="text-[0.97rem]">{{ tagline }}</p>
  {{# if highlights }}
  <ul class="list-disc pl-4 text-[0.93rem] text-muted">
    {{# each highlights }}<li class="marker:text-line-strong">{{ this }}</li>{{/ each }}
  </ul>
  {{/ if }}
  <span class="mt-auto pt-3.5 font-display text-[0.93rem] font-semibold text-brand">View product</span>
</a>
