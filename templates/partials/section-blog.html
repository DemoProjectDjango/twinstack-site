<section class="section-y{{# if band }} bg-mist{{ else }} border-t border-line{{/ if }}">
  <div class="wrap">
    <div class="mb-12 max-w-[60ch]">
      {{# if kicker }}<span class="mb-2 block font-display text-sm font-semibold text-brand">{{ kicker }}</span>{{/ if }}
      <h2 class="text-h2">{{ heading }}</h2>
      {{# if text }}<p class="mt-3.5 text-lede text-muted">{{ text }}</p>{{/ if }}
    </div>
    <div class="card-grid">
      {{# each latestPosts }}{{> card-post }}{{/ each }}
    </div>
    {{# if linkUrl }}<p class="mt-8"><a href="{{ linkUrl }}" class="font-medium text-brand hover:text-brand-dark">{{# if linkLabel }}{{ linkLabel }}{{ else }}All posts{{/ if }}</a></p>{{/ if }}
  </div>
</section>
