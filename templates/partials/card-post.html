<a class="card" href="{{ url }}">
  <div class="flex flex-wrap items-center gap-2 text-sm text-muted">
    {{# if category }}<span class="badge badge-brand">{{ category }}</span>{{/ if }}
    <span>{{ dateFormatted }} · {{ readingTime }} min read</span>
  </div>
  <h3 class="text-h3">{{ title }}</h3>
  <p class="text-[0.97rem]">{{ excerpt }}</p>
  <span class="mt-auto pt-3.5 font-display text-[0.93rem] font-semibold text-brand">Read the post</span>
</a>
