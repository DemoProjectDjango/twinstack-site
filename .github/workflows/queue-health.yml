name: Blog queue health

on:
  schedule:
    - cron: "0 9 1 * *"   # first of the month
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: queue
        run: |
          COUNT=$(node -e "const q=require('./content/data/blog-queue.json');console.log(q.topics.filter(t=>t.status==='queued').length)")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - if: steps.queue.outputs.count < 4
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Blog queue is down to ${{ steps.queue.outputs.count }} topics`,
              body: 'Add topics to `content/data/blog-queue.json` with `"status": "queued"` so the weekly scheduler has material.'
            })
